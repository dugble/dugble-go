name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
          cache: false
      - run: |
          gofmt -w .
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: format Go SDK"
            git push origin HEAD:${{ github.head_ref }}
          fi

  test:
    needs: format
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ["1.22.x", "1.24.x", "1.26.x"]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: false
      - run: gofmt -w . && git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
